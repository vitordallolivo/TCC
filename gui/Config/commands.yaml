commands:

  sudo:
    help: "Eleva privilégios para comandos restritos"
    type: "function"

  restart:
    help: "Reinicia o sistema (Reroda a mainApp.py)"

  exit:
    help: "Fecha o terminal ou aplicacao se 'exit all' "
    type: "string"

  ping:
    help: "Faz um ping de um site ou porta"
    type: "string"

  listing:
    help: "Escuta uma porta aberta no PC"
    type: "string"

  tcpdump:
    help: "Monitora pacotes brutos de um IP. Uso: tcpdump [IP] [tempo_segundos]"
    type: "function"
    admin_only: true # Nova flag de proteção
    args:
      target_ip: "string"
      duration: "int"

  ipconfig:
    help: "Pega o ipconfig do computador, para descobrir se o PC tem ETH"

  # --- Placa de medição (mesma gramática do placa.py, ver comandos.py) ---
  connect:
    help: "Conecta na placa (connect [IP] troca o IP antes)"
    type: "string"

  arm:   { help: "Pronto: pré-carga -> potência -> ESC armado" }
  "off": { help: "Desarma o ESC e abre os relés" }
  estop: { help: "Parada de emergência" }
  esc:   { help: "Throttle em %: esc <0..100>", type: "string" }
  reset: { help: "Reinicia o firmware" }
  raw:   { help: "CMD cru pelos índices: raw <f> <i> <t> <valor> <acao>", type: "string" }
  alvos: { help: "Lista os sensores e parâmetros aceitos pelo 'set'" }

  # Sobrescrita do botão FÍSICO de emergência. De propósito só aqui, e não
  # como botão de tela: é desvio de segurança, não operação de rotina.
  force:
    help: "Sobrescreve o botão físico de emergência: force [on|off]"
    # Aspas obrigatórias: em YAML, `on`/`off` sem aspas viram booleanos.
    "on":  { help: "A placa passa a IGNORAR o botão de emergência" }
    "off": { help: "A placa volta a respeitar o botão de emergência" }

  set:
    help: "set <sensor> linear|offset|min|max <valor> | set <sensor> reset | set <parâmetro> <valor>"
    load_cell_0: &sensor_cmds
      linear: { help: "Ganho de calibração" }
      offset: { help: "Zero do sensor (tara nas células de carga)" }
      reset:  { help: "Volta ao default" }
      max:    { help: "Limite MÁXIMO válido" }
      min:    { help: "Limite MÍNIMO válido" }
    load_cell_1: *sensor_cmds
    load_cell_2: *sensor_cmds
    load_cell_3: *sensor_cmds
    load_cell_4: *sensor_cmds
    load_cell_5: *sensor_cmds
    v_batt:      *sensor_cmds
    i_batt:      *sensor_cmds
    v_a:         *sensor_cmds
    v_b:         *sensor_cmds
    v_c:         *sensor_cmds
    i_a:         *sensor_cmds
    i_b:         *sensor_cmds
    i_c:         *sensor_cmds
    # Parâmetros do motor e do observador: 'set <parâmetro> <valor>'
    pole_pairs:  { help: "Pares de polos" }
    resistance:  { help: "Resistência de fase (Ohms)" }
    inductance:  { help: "Indutância de fase (Henry)" }
    kv:          { help: "Kv do motor (RPM/V)" }
    gamma1:      { help: "Ganho Γ1 do observador" }
    gamma2:      { help: "Ganho Γ2 do observador" }
    gammat:      { help: "Ganho Γt do observador" }
    bemf_lpf:    { help: "Corte do filtro da FCEM (Hz)" }
    torque_lpf:  { help: "Corte do filtro do torque (Hz)" }
    ts_adc:      { help: "Período do quadro do ADC (µs)" }

  bat:
    help: "Parâmetros da bateria: bat <p0..p4|temp_limit|relay> <valor>"
    p0: { help: "Coeficiente P0 do polinômio do SOC" }
    p1: { help: "Coeficiente P1 do polinômio do SOC" }
    p2: { help: "Coeficiente P2 do polinômio do SOC" }
    p3: { help: "Coeficiente P3 do polinômio do SOC" }
    p4: { help: "Coeficiente P4 do polinômio do SOC" }
    temp_limit: { help: "Limite de temperatura (°C)" }
    relay: { help: "Só os relés: 1 liga, 0 desliga" }

  mock:
    help: "Simulador Python (fake): mock [start|stop]"
    start: { help: "Inicia o simulador em 127.0.0.1" }
    stop:  { help: "Volta para a placa real" }

  native:
    help: "Firmware real em native_sim (Linux): native [start|stop|shell]"
    start: { help: "Sobe firmware/build_native_sim/zephyr/zephyr.exe (make native_sim)" }
    stop:  { help: "Encerra o processo do firmware" }
    shell: { help: "Linha para o shell do firmware: native shell tele", type: "string" }

  test_io:
    help: "Testa RX/TX (envia CMD neutro, espera telemetria)"

  graph:
    help: "Gerencia os graficos"

    clear:
      help: "Limpa o buffer do grafico, se 'graph clear', limpa tudo se graph clear [1-24] limpa o especifico"
      type: "string"

    mock_data:
      help: "Controla a geração de dados simulados para testes de UI"
      
      start:
        help: "Inicia o mock. Uso: mock_data start [all | 1-24]"
        type: "string"
      stop:
        help: "Para a geração de dados simulados"
        type: "null"

  logs:
    help: "Telemetria das placas neste terminal: logs [on|off]. Comeca DESLIGADA"
    # Aspas obrigatorias: `on`/`off` sem aspas viram booleanos em YAML.
    "on":  { help: "Passa a imprimir cada pacote de telemetria recebido" }
    "off": { help: "Silencia a telemetria (respostas de comando continuam)" }

  clear: { help: "Limpa a tela do terminal" }
  help: { help: "Mostra esta lista de ajuda" }