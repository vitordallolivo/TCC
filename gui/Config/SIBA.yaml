# ===================================================
#  This file contains setting of SIBA board 
# ===================================================

# CMD -> FUNCTION, INSTRUCTION, TARGET, VALUE, STATUS OR ACTION

DEFAULT_IP_BOARD : "169.254.97.200"
DEFAULT_PORT: 5555

# Bloco de link (fonte de verdade do endereçamento, lido por
# Communication_Data/registry.py). pc_rx = porta onde o PC ESCUTA a telemetria;
# board_rx = porta onde a placa ESCUTA os comandos CMD.
link:
  transport: udp_struct
  ip: "169.254.97.200"
  ports:
    pc_rx: 5555
    board_rx: 5000

enums:
  func_type:
    - FUNC_START
    - FUNC_STOP
    - FUNC_RESET
    - FUNC_SENSOR
    # Needs to be separate because of safety priority
    - FUNC_ESC            
    - FUNC_BATTERY        

  instruct_type:
    - INSTR_READ
    - INSTR_WRITE
    - INSTR_NONE
    - INSTR_DEFAULT # Logic link: default_action / battery_action

  # ATENÇÃO: a ordem/índice aqui precisa bater 1:1 com SENSOR_ID_* em
  # Log_Manager.h (gerado a partir de SENSORS abaixo) — CMD_Core.c usa
  # cmd->target_id diretamente como índice de sensor_cfg[]/adc_calib[]
  # (ver apply_sensor_calib em CMD_Core.c). Qualquer descompasso aqui faz
  # a calibração ser aplicada ao sensor errado silenciosamente.
  target_type:
    - TARGET_LOAD_CELL_0_enum     # 0  -> SENSOR_ID_LOAD_CELL_0
    - TARGET_LOAD_CELL_1_enum     # 1  -> SENSOR_ID_LOAD_CELL_1
    - TARGET_LOAD_CELL_2_enum     # 2  -> SENSOR_ID_LOAD_CELL_2
    - TARGET_LOAD_CELL_3_enum     # 3  -> SENSOR_ID_LOAD_CELL_3
    - TARGET_LOAD_CELL_4_enum     # 4  -> SENSOR_ID_LOAD_CELL_4
    - TARGET_LOAD_CELL_5_enum     # 5  -> SENSOR_ID_LOAD_CELL_5
    - TARGET_VOLTAGE_DIVIDOR      # 6  -> SENSOR_ID_V_BATT
    - TARGET_CURRENT_SENSOR       # 7  -> SENSOR_ID_I_BATT
    - TARGET_BATTERY_SOC          # 8  -> SENSOR_ID_SOC (sem hardware/calibração própria — placeholder de alinhamento)
    - TARGET_TEMPERATURE_SENSOR   # 9  -> SENSOR_ID_TEMPERATURE_BATTERY
    - TARGET_PITOT_TUBE           # 10 -> SENSOR_ID_AIR_SPEED
    - TARGET_DEFAULT              # 11 -> alvo genérico (START/STOP/RESET)
    - TARGET_TEMPERATURE_MOTOR    # 12 -> SENSOR_ID_TEMPERATURE_MOTOR
    # Fases do motor pela AQ1 (vindo da SAME). Mesma ordem dos SENSOR_ID_V_A..I_C
    # (13..18): calibração por FUNC_SENSOR igual aos outros sensores ADC.
    - TARGET_PHASE_V_A            # 13 -> SENSOR_ID_V_A
    - TARGET_PHASE_V_B            # 14 -> SENSOR_ID_V_B
    - TARGET_PHASE_V_C            # 15 -> SENSOR_ID_V_C
    - TARGET_PHASE_I_A            # 16 -> SENSOR_ID_I_A
    - TARGET_PHASE_I_B            # 17 -> SENSOR_ID_I_B
    - TARGET_PHASE_I_C            # 18 -> SENSOR_ID_I_C
    # Observador SMO+PLL (vindo da SAME): FUNC_SENSOR + INSTR_WRITE, `value` =
    # novo valor; action SENSE_RESET_DEFAULT volta ao default. Ganhos na forma
    # Γ = K·Ts (ver SAME/CLAUDE.md). TS_ADC em µs.
    - TARGET_POLES_PAIRS          # 19
    - TARGET_RESISTANCE           # 20
    - TARGET_INDUCTANCE           # 21
    - TARGET_KV_RATING            # 22
    - TARGET_GAMMA1               # 23
    - TARGET_GAMMA2               # 24
    - TARGET_GAMMAT               # 25
    - TARGET_BEMF_LPF_FREQUENCY   # 26
    - TARGET_TORQUE_LPF_FREQUENCY # 27
    - TARGET_TS_ADC               # 28

  # Campo `action_or_status` do CMD quando a função é FUNC_START e o alvo é
  # TARGET_DEFAULT. É por aqui que o supervisório comanda a cadeia de potência
  # da bancada, sem depender do shell de diagnóstico (que não vai no produto).
  #
  #   FUNC_START / INSTR_WRITE / TARGET_DEFAULT / action_or_status =
  #     STATUS_OK                  -> "tudo certo, pode armar": fecha pré-carga,
  #                                   espera, fecha potência e arma o ESC.
  #                                   SÓ acontece se o botão de emergência
  #                                   estiver liberado (ou sobrescrito).
  #     STATUS_ERROR               -> desligar: desarma o ESC e abre os dois
  #                                   relés (potência depois pré-carga).
  #     STATUS_EMERGENCY_OVERRIDE  -> passa a IGNORAR o botão físico de
  #                                   emergência.
  #     STATUS_EMERGENCY_RESTORE   -> volta a respeitar o botão.
  #
  # Para armar com o botão apertado o PC precisa enviar os DOIS: primeiro o
  # override, depois o STATUS_OK. Acrescentar valores só no FIM da lista — o
  # índice é compartilhado com a GUI.
  status_type:
    - STATUS_OK
    - STATUS_ERROR
    - STATUS_NONE # Don't care
    - STATUS_EMERGENCY_OVERRIDE # Ignora o botão físico de emergência
    - STATUS_EMERGENCY_RESTORE  # Volta a respeitar o botão físico

  default_action:
    - DEFAULT_ACTION_NONE # Does nothing
    # Sensor typical actions y = LINEAR_COEFF *x + OFFSET_COEF
    # Serves for sensor like current, voltage, ESC, pitot and Load Cells
    # For load cells Linear coeff = Calibrate, and Offset coeff = Tare
    - DEFAULT_ACTION_SENSE_LINEAR_COEF
    - DEFAULT_ACTION_SENSE_OFFSET_COEF
    - DEFAULT_ACTION_SENSE_RESET_DEFAULT
    # Limites de validade/segurança por sensor (usados pelos managers p/ reagir).
    # `value` = novo limite máximo/mínimo do sensor.
    - DEFAULT_ACTION_SENSE_MAX_VALID
    - DEFAULT_ACTION_SENSE_MIN_VALID

  battery_action:
    # Overwrites polynomial
    - BAT_ACTION_P0_OVERWRITE
    - BAT_ACTION_P1_OVERWRITE
    - BAT_ACTION_P2_OVERWRITE
    - BAT_ACTION_P3_OVERWRITE
    - BAT_ACTION_P4_OVERWRITE
    # Overwrites default Temperature limit
    - BAT_ACTION_TEMP_LIMIT_OVERWRITE  
    # Controls relay to turn on ESC
    - BAT_ACTION_RELAY

  log_status:
    - LOG_VALID
    - LOG_INVALID
    - LOG_OVERFLOW
    - LOG_CRITICAL_ALARM
    - LOG_DENIED_ACTION

# Códigos de erro agregados — 1 bit por condição de erro/alarme. FONTE ÚNICA:
# gera o enum C `siba_error_bit_t` (lib/SYS/Error_Codes.h, via generate.py) E
# alimenta a decodificação em pt-BR da GUI (Communication_Data/errors.py, que lê
# esta MESMA seção). O firmware agrega os bits no Security_Manager e envia o
# uint32_t em TELEMETRY_LOG.error_code. `bit` = posição (0..31); `msg` = mensagem
# clara pro usuário (o que houve + o que fazer); `group` = área na interface.
# `error_bit:` em sensor_defaults referencia estes nomes.
error_bits:
  # --- Bateria ---
  - { name: ERROR_BATT_LOW_SOC,               bit: 0,  group: "Bateria",      msg: "Bateria com carga baixa (nível abaixo do limite de alerta)" }
  - { name: ERROR_BATT_POLY_MISCONFIGURED,    bit: 1,  group: "Bateria",      msg: "Cálculo de carga da bateria mal configurado (revise o polinômio de SOC)" }
  - { name: ERROR_BATT_LOW_VOLTAGE,           bit: 2,  group: "Bateria",      msg: "Tensão da bateria baixa — alguma célula perto do limite mínimo" }
  - { name: ERROR_BATT_RELAY_MISMATCH,        bit: 3,  group: "Bateria",      msg: "Passando corrente com o relé desligado — possível falha no relé" }
  - { name: ERROR_BATT_OVER_TEMPERATURE,      bit: 4,  group: "Bateria",      msg: "Bateria superaquecendo (temperatura acima do limite de alarme)" }
  # --- Motor / Hélice ---
  - { name: ERROR_PROP_LOAD_CELL_NOT_CONFIGURED, bit: 8,  group: "Motor/Hélice", msg: "Célula de carga sem calibração — tare e calibre antes de medir" }
  - { name: ERROR_PROP_LOAD_CELL_NOT_CONNECTED,  bit: 9,  group: "Motor/Hélice", msg: "Célula de carga desconectada (HX711 não responde)" }
  - { name: ERROR_PROP_OVERCURRENT,           bit: 10, group: "Motor/Hélice", msg: "Corrente do motor acima do limite permitido" }
  # --- Segurança ---
  - { name: ERROR_SEC_VOLTAGE_OUT_OF_RANGE,   bit: 16, group: "Segurança",    msg: "Tensão da bateria fora da faixa segura de operação" }
  - { name: ERROR_SEC_CURRENT_EXCESSIVE,      bit: 17, group: "Segurança",    msg: "Corrente da bateria excessiva (acima do limite de segurança)" }
  - { name: ERROR_SEC_RPM_EXCESSIVE,          bit: 18, group: "Segurança",    msg: "Rotação do motor (RPM) acima do limite de segurança" }
  - { name: ERROR_SEC_EMERGENCY_ACTIVE,       bit: 19, group: "Segurança",    msg: "PARADA DE EMERGÊNCIA ativa — motor desarmado" }
  # --- Sistema ---
  - { name: ERROR_OS_GPIO_INIT_FAILED,        bit: 24, group: "Sistema",      msg: "Falha ao inicializar um módulo de hardware (GPIO)" }
  - { name: ERROR_MCU_POWER_READY,            bit: 25, group: "Sistema",      msg: "Bancada não inicializada — aguardando sequência de energização (relé)" }
  # --- Fases do motor e observador (vindos da SAME). Só diagnóstico: não
  # disparam parada de emergência. BEMF baixa / PLL sem lock NÃO viram bit
  # (são o estado normal com o motor parado e apagariam o LED de pronto). ---
  - { name: ERROR_MEAS_OVERCURRENT,           bit: 11, group: "Medição",      msg: "Corrente de fase acima do limite seguro" }
  - { name: ERROR_MEAS_SENSOR_RANGE,          bit: 12, group: "Medição",      msg: "Leitura de tensão/corrente de fase fora da faixa válida (saturada ou desconectada)" }
  - { name: ERROR_OBS_DIVERGED,               bit: 20, group: "Observador",   msg: "Observador divergiu (valores não finitos) — reduza os ganhos Γ ou o passo Ts" }
  - { name: ERROR_OBS_RPM_IMPLAUSIBLE,        bit: 21, group: "Observador",   msg: "Rotação estimada acima do limite plausível para este motor" }
  - { name: ERROR_CFG_MOTOR_PARAM_INVALID,    bit: 22, group: "Configuração", msg: "Parâmetro do motor inválido (R, L, pares de polos, Kv ou Ts ≤ 0) — configure antes de estimar" }
  - { name: ERROR_CFG_GAMMA_SIGN,             bit: 23, group: "Configuração", msg: "Sinais dos ganhos Γ incorretos (regra fixa: Γ1 > 0, Γ2 < 0, Γt > 0)" }
  - { name: ERROR_SYS_ADC_FRAME_DROP,         bit: 26, group: "Sistema",      msg: "Lotes do ADC descartados — o processamento não acompanhou a aquisição; o observador recebeu amostras com lacunas" }
  - { name: ERROR_CAL_IN_PROGRESS,            bit: 27, group: "Calibração",   msg: "Calibração de offset das correntes em andamento (Hall estabilizando, ESC parado) — rotação e torque ainda não são válidos" }
  - { name: ERROR_CAL_FAILED,                 bit: 28, group: "Calibração",   msg: "Calibração de offset falhou: ruído alto nas correntes com o ESC parado — ESC energizado, sensor sem alimentação ou terra aberto" }

# Limiares dos checadores das fases/observador — geram lib/SYS/Security_prm.h.
security_limits:
  - { name: SM_OVERCURRENT_A,  value: 60.0,    comment: "limite de sobrecorrente de fase [A]" }
  - { name: SM_SENSOR_ABS_MAX, value: 500.0,   comment: "leitura de V/A acima disso = sensor saturado ou desconectado" }
  - { name: SM_RPM_MAX,        value: 60000.0, comment: "rpm mecânico plausível máximo" }
  - { name: SM_CAL_SETTLE_MS,  value: 2000.0,  comment: "espera antes de amostrar o offset [ms]: o SS49E deriva no aquecimento inicial" }
  - { name: SM_CAL_FRAMES,     value: 4096.0,  comment: "quadros acumulados para a média do offset (com o ESC parado)" }
  - { name: SM_CAL_STD_MAX_MV, value: 20.0,    comment: "desvio-padrão máximo nas amostras de offset [mV no pino]; o ruído medido com o ESC parado é 9–10 mV (era 8 e reprovava sempre)" }
  - { name: SM_CAL_MEAN_MIN_MV, value: 1200.0, comment: "média mínima do repouso do Hall no pino [mV] (esperado ~1670 mV); abaixo = cabo solto/curto" }
  - { name: SM_CAL_MEAN_MAX_MV, value: 2200.0, comment: "média máxima do repouso do Hall no pino [mV]; acima = cabo solto (fundo de escala)" }

# Defaults de calibração afim (y = linear*x + offset) + faixa válida/segurança
# por sensor — fonte única, alimenta CMD_Core_prm.h (gerado, ver generate.py).
# `target` é SENSOR_ID_<NOME_DO_CAMPO_TELEMETRY_LOG> (gerado em Log_Manager.h)
# — não target_type, porque a ordem de TELEMETRY_LOG diverge da de target_type
# nalgumas placas (ver SAME.yaml, que já usa target_type direto porque lá
# bate). `error_bit` é opcional (siba_error_bit_t, Security_Manager.h) — só
# nos sensores que disparam emergência quando saem da faixa [min,max].
sensor_defaults:
  - { target: SENSOR_ID_LOAD_CELL_0, linear: 1.0, offset: 0.0, min: "-CMD_CORE_NO_LIMIT", max: "CMD_CORE_NO_LIMIT" }
  - { target: SENSOR_ID_LOAD_CELL_1, linear: 1.0, offset: 0.0, min: "-CMD_CORE_NO_LIMIT", max: "CMD_CORE_NO_LIMIT" }
  - { target: SENSOR_ID_LOAD_CELL_2, linear: 1.0, offset: 0.0, min: "-CMD_CORE_NO_LIMIT", max: "CMD_CORE_NO_LIMIT" }
  - { target: SENSOR_ID_LOAD_CELL_3, linear: 1.0, offset: 0.0, min: "-CMD_CORE_NO_LIMIT", max: "CMD_CORE_NO_LIMIT" }
  - { target: SENSOR_ID_LOAD_CELL_4, linear: 1.0, offset: 0.0, min: "-CMD_CORE_NO_LIMIT", max: "CMD_CORE_NO_LIMIT" }
  - { target: SENSOR_ID_LOAD_CELL_5, linear: 1.0, offset: 0.0, min: "-CMD_CORE_NO_LIMIT", max: "CMD_CORE_NO_LIMIT" }
  - { target: SENSOR_ID_V_BATT, linear: 0.008, offset: 0.0, min: 0.0, max: 72.0, error_bit: ERROR_SEC_VOLTAGE_OUT_OF_RANGE }
  - { target: SENSOR_ID_I_BATT, linear: 0.020, offset: 0.0, min: "-CMD_CORE_NO_LIMIT", max: 60.0, error_bit: ERROR_SEC_CURRENT_EXCESSIVE }
  - { target: SENSOR_ID_SOC, linear: 1.0, offset: 0.0, min: 0.0, max: 100.0 }
  - { target: SENSOR_ID_TEMPERATURE_BATTERY, linear: 0.040, offset: 0.0, min: -40.0, max: 85.0, error_bit: ERROR_BATT_OVER_TEMPERATURE }
  # Tubo de Pitot com MPX5002DP. ÚNICO sensor que não é afim: por Bernoulli
  # v = sqrt(2*dP/rho), então a velocidade cresce com a RAIZ da pressão
  # diferencial e nenhuma reta descreve o sensor em faixa alguma. Daí law: sqrt.
  #
  #     v = linear * sqrt(mV_no_pino - zero) + offset
  #
  # Constantes do ensaio em túnel de vento feito pela Equipe Albatroz no IPT
  # (Anexo A da monografia), com sensor / ar / conversor separados:
  #     sensibilidade do sensor   S   = 629,8 µV/Pa
  #     saída com escoamento nulo V0  = 2,66442 V  ->  zero = 2664,4 mV
  #     densidade do ensaio       rho = 1,110 kg/m3
  #     linear = sqrt(2/(rho*S)) convertido para mV = 1,691423
  #
  # `zero` é TENSÃO do sensor, não contagem de ADC: não muda com a resolução
  # do conversor. O ensaio usou Arduino Uno (10 bits/5 V, 4,89 mV/LSB); a SIBA
  # lê com 12 bits/3,3 V (0,806 mV/LSB), 6,1x mais fino — a incerteza de 1 LSB
  # a 5 m/s cai de 1,40 para 0,23 m/s.
  #
  # ⚠️ `linear` carrega a densidade do ar embutida. Operar em altitude ou
  # temperatura bem diferentes exige recalcular por linear = sqrt(2/(rho*S));
  # enquanto rho for o da calibração o erro se cancela. A SIBA não tem
  # barômetro para fazer isso sozinha (ver sec:calibracao_pitot).
  #
  # min/max: 0 (a raiz satura ali) a 42 m/s, onde a entrada do conversor
  # esgota. Abaixo de ~3 m/s a leitura é dominada por ruído mesmo com 12 bits.
  - { target: SENSOR_ID_AIR_SPEED, linear: 1.691423, offset: 0.0, zero: 2664.4, law: sqrt, min: 0.0, max: 42.0 }
  - { target: SENSOR_ID_RPM, linear: 1.0, offset: 0.0, min: "-CMD_CORE_NO_LIMIT", max: 20000.0, error_bit: ERROR_SEC_RPM_EXCESSIVE }
  # Termistor NTC no estator/carcaça do motor — mesma cadeia de condicionamento
  # do termistor de bateria (0,040 °C/mV). Máximo 150 °C (limite típico de
  # enrolamentos BLDC classe F). Sem bit de erro por ora (só diagnóstico).
  - { target: SENSOR_ID_TEMPERATURE_MOTOR, linear: 0.040, offset: 0.0, min: -40.0, max: 150.0 }
  # Fases do motor pela AQ1 (mesma cadeia da SAME), x = mV no pino.
  # Tensão: divisor 100k/5k6 → 0,0188571 V/mV.
  # Corrente: SS49E + divisor 4k7/10k → 0,0784 A/mV; o offset é o zero de cada
  # fase, refeito a cada boot com o ESC parado (calibração de offset no HAL).
  - { target: SENSOR_ID_V_A, linear: 0.0188571, offset: 0.0, min: "-CMD_CORE_NO_LIMIT", max: "CMD_CORE_NO_LIMIT" }
  - { target: SENSOR_ID_V_B, linear: 0.0188571, offset: 0.0, min: "-CMD_CORE_NO_LIMIT", max: "CMD_CORE_NO_LIMIT" }
  - { target: SENSOR_ID_V_C, linear: 0.0188571, offset: 0.0, min: "-CMD_CORE_NO_LIMIT", max: "CMD_CORE_NO_LIMIT" }
  - { target: SENSOR_ID_I_A, linear: 0.0784, offset: -136.315, min: "-CMD_CORE_NO_LIMIT", max: "CMD_CORE_NO_LIMIT" }
  - { target: SENSOR_ID_I_B, linear: 0.0784, offset: -137.987, min: "-CMD_CORE_NO_LIMIT", max: "CMD_CORE_NO_LIMIT" }
  - { target: SENSOR_ID_I_C, linear: 0.0784, offset: -136.657, min: "-CMD_CORE_NO_LIMIT", max: "CMD_CORE_NO_LIMIT" }

structs:

  SENSORS: # Configuration of sensors
    - { name: SensorTarget, type: target_type }
    - { name: Linear_Coeff, type: float }
    - { name: Offset_Coeff, type: float }
    - { name: Max_Valid_Value, type: float }
    - { name: Minimum_Valid_Value, type: float }
    - { name: Linear_Coeff_Reset_Default, type: float}
    - { name: Offset_Coeff_Reset_Default, type: float}

  CMD:
    - { name: function, type: func_type }      # Main command category
    - { name: instruction, type: instruct_type }   # Read or Write
    - { name: target_id, type: int8_t }           
    - { name: value, type: float }               # Data (e.g., Gain, Offset, or Duty Cycle)
    - { name: action_or_status, type: int8_t }  # Overloaded: battery_action, default_action or status_type

  TELEMETRY_LOG:
    - { name: timestamp, type: uint32_t }          # System uptime in milliseconds
    - { name: load_cell_0, type: float }           # Force (in N or kgf) or Torque
    - { name: load_cell_1, type: float }
    - { name: load_cell_2, type: float }
    - { name: load_cell_3, type: float }
    - { name: load_cell_4, type: float }
    - { name: load_cell_5, type: float }
    - { name: v_batt, type: float }                # Battery Voltage (V)
    - { name: i_batt, type: float }                # Battery Current (A)
    - { name: soc, type: float }                   # State of Charge (0.0 - 100.0%)
    - { name: temperature_battery, type: float }
    - { name: air_speed, type: float }             # Pitot tube wind speed (m/s)
    - { name: rpm, type: float }                   # Motor revolutions per minute
    - { name: temperature_motor, type: float }   # Motor winding temperature (°C), ADC1 CH3/PA3
    - { name: status, type: log_status }         # Integrity of the telemetry frame
    - { name: error_code, type: uint32_t }        # Bitfield agregado pelo Security_Manager (1 bit/condição) — ver CLAUDE.md "Error_Detect/Error_Erase"
    # Fases do motor medidas pela placa AQ1 (mesma cadeia da SAME).
    - { name: V_a, type: float }
    - { name: V_b, type: float }
    - { name: V_c, type: float }
    - { name: i_a, type: float }
    - { name: i_b, type: float }
    - { name: i_c, type: float }
    # Tempo do pipeline do ADC (ISR do DMA → fim do lote). Ver SIBA/lib/OS/HAL.c.
    - { name: t_proc_us, type: float }            # pior tempo de EXECUÇÃO do processamento de um lote na janela [µs]
    - { name: t_batch_us, type: float }           # pior intervalo entre ISRs do DMA na janela [µs]
    - { name: batch_drops, type: float }          # lotes descartados por chegarem durante o processamento (acumulado)
    - { name: t_lat_us, type: float }             # pior latência ISR → início do processamento na janela [µs]
    # Observador SMO+PLL (vindo da SAME), com LPF de 2 Hz nas saídas.
    - { name: rpm_same, type: float }             # rotação mecânica estimada [rpm]
    - { name: torque_eletrico, type: float }      # torque eletromagnético estimado [N·m]
    - { name: torque_helice, type: float }        # torque na hélice (hoje = torque_eletrico) [N·m]