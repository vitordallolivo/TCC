# Overlay de configuração para `west build -b native_sim` (modo mock —
# ver CLAUDE.md/HW.md "Mock mode (native_sim)"). Sobrepõe prj.conf.
#
# native_sim roda o firmware como um binário POSIX comum (host Linux) —
# não existe CH32V307, ADC custom, GPIO bit-bang do HX711, PWM/TIM4 do ESC,
# TIM3 de RPM nem MAC Ethernet. HAL_mock.c substitui HAL.c (ver
# CMakeLists.txt: `if(NOT CONFIG_ARCH_POSIX)`) e não usa nenhum driver de
# hardware — só gera dados sintéticos e publica via OSSI.
#
# REDE: em vez de desligar (como antes), usamos os "Offloaded sockets" do
# Native Simulator (NSOS) — ver doc/connectivity/networking/native_sim_setup.rst
# "Using offloaded sockets". O zsock_socket()/bind()/sendto() de NCI.c são
# redirecionados DIRETO para os sockets BSD do host Linux — sem TAP, sem
# privilégio root, sem stack de rede do Zephyr. O processo do firmware vira
# literalmente "mais um programa" no localhost: `127.0.0.1`. Com isso, o
# app Python (Aplicacao_Pi/Communication_Data/Ethernet.py) consegue trocar
# pacotes UDP de verdade com o firmware rodando como binário no host — ver
# CLAUDE.md "Modo Mock (native_sim)" e Aplicacao_Pi/CLAUDE.md.
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_DRIVERS=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_IPV6_DAD=n

# IPs "internos" do host (loopback) — substituem os link-local fixos da
# placa real (169.254.97.x, que dependem do MAC Ethernet físico).
# NCI.c referencia esses símbolos diretamente (zsock_inet_pton); manter
# CONFIG_NET_CONFIG_SETTINGS=y só para que eles tenham valor — o NSOS não
# usa interface/endereço configurado, ele repassa os sockets ao host.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="127.0.0.1"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="127.0.0.1"
CONFIG_NET_CONFIG_NEED_IPV4=y

# O driver custom adc_ch32v307 (out-of-tree, MMIO+DMA do CH32V307) não
# compila para native_sim — mas em vez de desligar o ADC e trocar HAL.c
# inteiro por um mock (abordagem antiga, HAL_mock.c), ligamos o emulador
# ADC in-tree do Zephyr (CONFIG_ADC_EMUL) sob o MESMO nodelabel `adc1`
# (ver boards/native_sim.overlay) — HAL.c usa só a API genérica
# adc_channel_setup/adc_read_async, então roda sem nenhuma alteração.
# CONFIG_ADC_ASYNC continua ligado pois HAL_thread_ADC_fn usa adc_read_async.
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_ADC_EMUL=y
CONFIG_ADC_LOG_LEVEL_DBG=n

# I2C1 (PB8/PB9 remap, ver HAL_I2C_*) — driver wch,i2c não compila para
# native_sim, mas o nodelabel `i2c1` existe via zephyr,i2c-emul-controller
# (ver boards/native_sim.overlay), mesma estratégia do ADC acima. CONFIG_EMUL
# é o framework genérico de dispositivos emulados exigido por CONFIG_I2C_EMUL.
CONFIG_I2C=y
CONFIG_EMUL=y
CONFIG_I2C_EMUL=y

# PWM (ESC/TIM4) e Counter (RPM/TIM3) NÃO têm substituto in-tree viável
# para um build de firmware normal:
#   - zephyr,fake-pwm (CONFIG_PWM_FAKE) é FFF-based e exige
#     subsys/testsuite/include/zephyr/fff.h — só existe em builds
#     Twister/ztest, não em app comum (erro: "zephyr/fff.h: arquivo
#     inexistente" ao tentar habilitar aqui)
#   - HAL.c acessa o TIM3 (RPM) via MMIO bruto em endereço físico fixo
#     (0x40000400 — não existe em POSIX) e não há driver Zephyr para o
#     compatible "wch,gptm-counter" usado no .dts real
# Por isso esses dois ficam DESLIGADOS aqui — em vez de um nó/driver
# emulado, HAL_ESC_*/HAL_RPM_* ganham um pequeno bloco
# `#ifdef CONFIG_ARCH_POSIX` dentro do próprio HAL.c (modelo synthetic
# equivalente ao do antigo HAL_mock.c, isolado e mínimo — só essas duas
# peças realmente não têm como rodar "sem mudança nenhuma" em POSIX).
#
# CONFIG_GPIO continua ligado: native_sim tem gpio_emul, usado pelo
# fallback do relé em Battery_Manager (DT_ALIAS(relay0) ausente).
CONFIG_PINCTRL=n
CONFIG_PWM=n
CONFIG_COUNTER=n

# Sem isso, todo "%f"/"%.2f" em LOG_*/shell_print sai como texto literal
# (CBPRINTF_FP_SUPPORT default é "y if FPU", e FPU não vem ligado por
# padrão em native_sim mesmo o host tendo FPU de verdade) — quase todo
# log/print do SIBA usa float (sensores, calibração, etc.), então sem
# isso o shell fica ilegível em native_sim.
CONFIG_FPU=y

# prj.conf liga CONFIG_LOG_BACKEND_UART=y para a placa real (único backend
# de log lá). Em native_sim o board já seleciona CONFIG_LOG_BACKEND_NATIVE_POSIX
# por padrão (escreve direto no stdout do host, sem passar pelo driver de
# UART) — com os dois backends ativos ao mesmo tempo cada linha de log saía
# duplicada E competia pelo mesmo UART usado pelo shell (CONFIG_SHELL_BACKEND_SERIAL),
# o que impedia o prompt "uart:~$" de aparecer/funcionar com `-uart_stdinout`.
# Desligamos o backend de UART aqui para deixar o UART livre só para o shell.
CONFIG_LOG_BACKEND_UART=n
