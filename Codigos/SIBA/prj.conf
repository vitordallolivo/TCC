CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_PWM=y
CONFIG_COUNTER=y
CONFIG_REBOOT=y
CONFIG_I2C=y
CONFIG_SPI=y

# ADC
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_ADC_LOG_LEVEL_DBG=n
# Driver upstream adc_ch32v00x.c também usa DT_DRV_COMPAT "wch,adc" e tem
# "default y depends on DT_HAS_WCH_ADC_ENABLED" — sem desabilitar aqui, ele
# vence a ligação com o nó `adc1` (é compilado incondicionalmente como parte
# da lib zephyr) e o linker descarta nosso libadc_ch32v307.a por completo
# (nada mais referencia símbolos só definidos nele). Resultado: adc1 fica
# associado à API do ch32v00x, que é síncrona only (sem .read_async) — uma
# chamada a adc_read_async() vira um jalr através de ponteiro NULL, que pula
# para o flash aliasado em 0x0 e reentra no código de boot, corrompendo o
# .bss em runtime (causa real do crash mcause=6/mtval=0x828067).
CONFIG_ADC_CH32V00X=n

# Rede
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_CONFIG_MY_IPV4_ADDR="169.254.97.51"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.0.0"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="169.254.255.255"
CONFIG_NET_SOCKETS=y

# Build
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_BUILD_OUTPUT_BIN=y

# LOGs e USART
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# Shell de teste (lib/SYS/Test_Shell.c) — usa o backend serial sobre o
# zephyr,shell-uart já declarado no .dts (mesmo UART do console/log)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y


CONFIG_HEAP_MEM_POOL_SIZE=8192

# Ponto flutuante: HAL, HX711, calibração usam float. cbprintf para %f nos logs.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Log buffer padrão (1024 B) causa "N messages dropped" no boot com FPU_SHARING
CONFIG_LOG_BUFFER_SIZE=4096

# ISR de DMA com FPU_SHARING salva 32 regs FP — stack padrão insuficiente
CONFIG_ISR_STACK_SIZE=4096

# Sysworkq processa ETH carrier_on (~1-2 ms) enquanto a ISR de ADC dispara a
# ~150 kHz. Com FPU_SHARING cada ISR salva 32 regs FP (128 B) na stack da
# thread interrompida. Stack padrão (4096 B) transborda → carrier_on falha em
# silêncio → IF_UP nunca dispara → rede fica OFFLINE para sempre.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# A logging_thread formata %f com FPU_SHARING ativo — stack padrão insuficiente
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y
CONFIG_MAIN_STACK_SIZE=8192

# Idle thread: com FPU_SHARING o _isr_wrapper salva 80 B de ESF na stack da
# thread interrompida — stack padrão de 256 B pode extrapolar no fim da RAM.
CONFIG_IDLE_STACK_SIZE=512

# Debug de bancada: imprime status de rede + telemetria na UART a cada 5 s
CONFIG_SIBA_NET_STATUS_UART=y