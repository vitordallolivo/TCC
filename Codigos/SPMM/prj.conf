# ====================================================================
# SPMM — Sistema Provisorio de Medicao Mecanica (CH32V307 + Zephyr)
# ====================================================================

# ---- Perifericos ----
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_PWM=y          # PWM de servo (TIM4 CH1) para o throttle do ESC
CONFIG_COUNTER=y      # (TIM3 usado via MMIO direto; mantido por consistencia)
CONFIG_REBOOT=y

# ---- ADC (correntes de fase) ----
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_ADC_LOG_LEVEL_DBG=n
# ATENCAO: o driver upstream adc_ch32v00x.c tambem casa com DT_DRV_COMPAT
# "wch,adc" e vence a ligacao com o no `adc1`, descartando nosso driver
# custom — e ele conflita com o registrador de Ethernet do CH32V307. Sem
# isso a Ethernet (Telnet + log UDP) quebra. Ver CLAUDE.md.
CONFIG_ADC_CH32V00X=n

# ---- Rede: Telnet (TCP) para o shell + UDP para o log ----
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=y
# IP da SPMM = 169.254.97.150 — NÃO colidir com a SAME (.100). Bate com o
# lado PC em Aplicacao_Pi/Config/SPMM.yaml (link.ip = .150).
CONFIG_NET_CONFIG_MY_IPV4_ADDR="169.254.97.150"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="169.254.97.139"

# ---- Shell por rede (Telnet) ----
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_TELNET=y
CONFIG_SHELL_BACKEND_SERIAL=n   # UART fica so para LOG local de debug

# ---- Reducao de FLASH (ROM ~90% cheia) ----
# O peso do shell nao e o parser em si, e as CONVENIENCIAS (textos de ajuda,
# historico, autocomplete, cores) + os modulos de comando EMBUTIDOS do Zephyr
# (net/device/kernel), que nao usamos. Removendo-os sobra flash sem perder os
# comandos de bancada (arm/throttle/coast/log...) nem o Telnet.
CONFIG_SHELL_HELP=n                 # remove os textos de ajuda (grande economia)
CONFIG_SHELL_HISTORY=n              # sem historico (setas cima/baixo)
CONFIG_SHELL_TAB=n                  # sem TAB
CONFIG_SHELL_TAB_AUTOCOMPLETION=n   # sem autocompletar
CONFIG_SHELL_VT100_COLORS=n         # sem cores ANSI
CONFIG_SHELL_METAKEYS=n             # sem atalhos Ctrl-*
CONFIG_SHELL_WILDCARD=n             # sem curinga
# Modulos de comando embutidos que NAO usamos (o 'net' costuma ser grande):
CONFIG_KERNEL_SHELL=n
CONFIG_DEVICE_SHELL=n
CONFIG_NET_SHELL=n

# ---- Console / LOG local (USART1) ----
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3
# LOG em modo minimo: usa printk direto (sincrono), sem o empacotamento
# deferido — bem menor em flash. Mantem LOG_INF/WRN/ERR funcionando.
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_PRINTK=y

# ---- Float (Clarke/Park, Iq, %f nos prints) ----
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# ---- Entropia / build ----
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_BUILD_OUTPUT_BIN=y

CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=2048
