# Overlay de Kconfig para `west build -b native_sim` (modo POSIX/mock).
# Sobrepoe prj.conf. Permite depurar a logica do shell, do parsing e do
# empacotamento UDP no PC, sem placa — ver CLAUDE.md "Copiar o setup de
# POSIX da SIBA".
#
# REDE: "Offloaded sockets" do Native Simulator (NSOS). zsock_socket/bind/
# sendto de telemetry.c sao redirecionados DIRETO para os sockets BSD do
# host Linux (127.0.0.1) — sem TAP, sem root, sem stack de rede do Zephyr.
# O firmware vira "mais um processo" no localhost e troca UDP de verdade
# com o script Python (scripts/spmm_bench.py).
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_DRIVERS=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_IPV6_DAD=n
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="127.0.0.1"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="127.0.0.1"
CONFIG_NET_CONFIG_NEED_IPV4=y

# Shell do Zephyr por backend "dummy" nao existe util aqui; em native_sim
# usamos o backend serial ligado ao stdin/stdout do host (-uart_stdinout).
# Assim os comandos de bancada (arm/throttle/coast/...) sao testaveis no
# terminal sem Telnet.
CONFIG_SHELL_BACKEND_TELNET=n
CONFIG_SHELL_BACKEND_SERIAL=y

# ADC emulado in-tree (ver native_sim.overlay). acquisition.c roda sem
# mudanca (API generica adc_channel_setup/adc_read_async).
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_ADC_EMUL=y

# ESC (PWM/TIM4) e RPM (Counter/TIM3) sao synthetic via #ifdef
# CONFIG_ARCH_POSIX nos modulos — sem driver de hardware aqui.
CONFIG_PWM=n
CONFIG_COUNTER=n

# PINCTRL so' existe para pinmux do SoC real (PWM/TIM). O native_sim nao
# tem pinctrl_soc.h; sem PWM aqui, o driver e' inutil e nao compila.
CONFIG_PINCTRL=n

# Float em LOG_*/shell_print e Clarke/Park precisam de FPU ligada; em
# native_sim ela nao vem por padrao (senao "%f" sai como texto literal).
CONFIG_FPU=y

# Em native_sim o board ja seleciona LOG_BACKEND_NATIVE_POSIX (stdout);
# desligar o backend de UART evita log duplicado competindo com o shell.
CONFIG_LOG_BACKEND_UART=n
