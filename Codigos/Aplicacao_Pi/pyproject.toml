[project]
name = "GUI_TCC"
version = "0.1.0"
description = "GUI desenvolvida para visualização de dados de um conjunto motopropulsor equipado com BLDCs"

requires-python = ">=3.11"

dependencies = [
    "numpy>=1.24",
    "PySide6>=6.0",
    "pyqtgraph",
    "packaging>=24.0"
]


[project.scripts]
tcc = "mainApp:main"    