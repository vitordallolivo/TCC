# ===============================================================
#  SPMM — Sistema Provisório de Medição Mecânica (bancada BLDC)
#  Protocolo DIFERENTE de SIBA/SAME: comandos por Telnet (TCP) +
#  log rápido por UDP binário. Ver ../SPMM/CLAUDE.md.
# ===============================================================

DEFAULT_IP_BOARD: "169.254.97.150"   # trocado p/ NÃO colidir com a SAME (.100)

# Bloco de link (lido por Communication_Data/registry.py). transport=telnet
# seleciona o TelnetLink (sessão TCP p/ comandos de texto + socket UDP p/ log).
link:
  transport: telnet
  ip: "169.254.97.150"
  ports:
    telnet: 23        # shell de comandos (arm/throttle/coast/log ...)
    udp_log: 5000     # streaming binário de amostras (n, omega, te)
  # Período de amostragem do micro. O PC reconstrói o tempo como t = n*Ts
  # (NUNCA o horário de chegada do pacote UDP — ver ../SPMM/CLAUDE.md).
  Ts: 0.0002

# Layout do pacote de log binário por UDP:
#   header  <HH>  -> count (nº de amostras), ts_us
#   sample  <Iff> -> n (contador), omega [rad/s], te [N·m]
log_packet:
  header: { format: "<HH>", fields: [count, ts_us] }
  sample: { format: "<Iff>", fields: [n, omega, te] }

# Comandos do shell de bancada (Telnet). Espelham SHELL_CMD_ARG_REGISTER do
# firmware; usados para montar a árvore `spmm ...` do commands.yaml.
shell_commands:
  arm:      { help: "Arma o ESC (sequência de armar)" }
  disarm:   { help: "Desarma o ESC (motor parado)" }
  throttle: { help: "Define PWM do ESC [us] (1000=parado, 2000=máx)", arg: us }
  ramp:     { help: "Rampa suave de throttle: ramp <us> <s>", args: [us, s] }
  rpm:      { help: "Lê a rotação atual" }
  iq:       { help: "Lê o Iq médio atual" }
  read:     { help: "Dump: rpm, Iq, Te" }
  patamar:  { help: "Vai ao throttle, estabiliza e grava ponto: patamar <us> <s>", args: [us, s] }
  coast:    { help: "Corta throttle e captura ω(t) do coast-down (ensaio J)" }
  log:      { help: "Streaming binário: log start <hz> | log stop", arg: mode }

# Telemetria da SPMM para os buffers/gráficos da GUI (mesmo esquema de
# TELEMETRY_LOG usado por SIBA/SAME, mas alimentado pelo TelnetLink).
telemetry_fields:
  - { name: omega, unit: "rad/s" }
  - { name: rpm,   unit: "RPM" }
  - { name: te,    unit: "N·m" }
