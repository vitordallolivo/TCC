commands:

  sudo:
    help: "Eleva privilégios para comandos restritos"
    type: "function"

  connect:
    help: "Conecta um IP qualquer"
    type: "string"

  exit:
    help: "Fecha o terminal ou aplicacao se 'exit all' "
    type: "string"

  ping:
    help: "Faz um ping de um site ou porta"
    type: "string"

  listing:
    help: "Escuta uma porta aberta no PC"
    type: "string"

  tcpdump:
    help: "Monitora pacotes brutos de um IP. Uso: tcpdump [IP] [tempo_segundos]"
    type: "function"
    admin_only: true # Nova flag de proteção
    args:
      target_ip: "string"
      duration: "int"

  ipconfig:
    help: "Pega o ipconfig do computador, para descobrir se o PC tem ETH"

  same:
    help: "Controle de Inversor e Motor (SAME)"
    
    # Comandos de Operação
    start:
      motor: { help: "Inicia o chaveamento do inversor" }
    stop:
      motor: { help: "Corte imediato de fase (Emergency)" }
    reset:
      system: { help: "Reinicia o controlador" }

    # Mock/Simulação interna na Board
    mock:
      help: "Simulação: same mock [start|stop]"
      start: { help: "Inicia simulação interna de motor" }
      stop: { help: "Retorna para leitura de sensores reais" }

    # Calibração e Parâmetros
    set:
      help: "Ajuste de parâmetros: same set [target] [action] [value]"
      
      # Alvos Físicos (Sensores)
      current_a: &sensor_cmds
        linear: { help: "Ganho linear" }
        offset: { help: "Offset/Zero" }
        reset: { help: "Reseta calibração" }
      current_b: *sensor_cmds
      voltage_a: *sensor_cmds
      voltage_b: *sensor_cmds
      voltage_c: *sensor_cmds

      # Alvos de Modelo (Motor & SMO)
      resistance: { help: "Resistência de fase (Ohms)" }
      inductance: { help: "Indutância de fase (Henry)" }
      ks1: { help: "Ganho Ks1 do Observador" }
      ks2: { help: "Ganho Ks2 do Observador" }
      bemf_lpf: { help: "Frequência de corte do filtro BEMF (Hz)" }
  
  siba:
    help: "Comandos da Placa de Gerenciamento de Energia (Power & Telemetry)"
    
    # Comandos de Operação
    start:
      telemetry: { help: "Inicia transmissão de dados via UDP" }
    stop:
      esc: { help: "Corte imediato de potência (Segurança)" }
    reset:
      system: { help: "Reinicia o firmware da board SIBA" }

    # Mock/Simulação interna na Board
    mock:
      help: "Simulação: siba mock [start|stop]"
      start: { help: "Inicia geração de dados randômicos" }
      stop: { help: "Retorna para leitura de sensores físicos" }

    # Calibração e Parâmetros (Padrão SAME)
    set:
      help: "Ajuste de parâmetros: siba set [target] [action] [value]"
      
      # Âncora para Sensores (Calibração Linear: y = ax + b)
      sensor_base: &siba_sensor_cmds
        linear: { help: "Define ganho de calibração (Scale/Linear)" }
        offset: { help: "Define o zero do sensor (Tara/Offset)" }
        reset:  { help: "Reseta para valores padrão de fábrica" }

      # Alvos de Força e Pressão (Células de Carga e Pitot)
      load_cell_0: *siba_sensor_cmds
      load_cell_1: *siba_sensor_cmds
      load_cell_2: *siba_sensor_cmds
      load_cell_3: *siba_sensor_cmds
      load_cell_4: *siba_sensor_cmds
      load_cell_5: *siba_sensor_cmds
      pitot_tube:  *siba_sensor_cmds
      
      # Alvos de Elétrica (Barramento Principal)
      v_batt:      *siba_sensor_cmds
      i_batt:      *siba_sensor_cmds

      # Parâmetros de Bateria (SOC e Proteção)
      # Aqui usamos 'value' como argumento direto
      temp_limit: { help: "Limite de temperatura para alarme (°C)" }
      relay:      { help: "Estado do Relé Principal (1=Ligado, 0=Desligado)" }
      soc_p0:     { help: "Coeficiente polinomial P0 do SOC" }
      soc_p1:     { help: "Coeficiente polinomial P1 do SOC" }
      soc_p2:     { help: "Coeficiente polinomial P2 do SOC" }
      soc_p3:     { help: "Coeficiente polinomial P3 do SOC" }
      soc_p4:     { help: "Coeficiente polinomial P4 do SOC" }

  graph:
    help: "Gerencia os graficos"

    clear:
      help: "Limpa o buffer do grafico, se 'graph clear', limpa tudo se graph clear [1-24] limpa o especifico"
      type: "string"

    mock_data:
      help: "Controla a geração de dados simulados para testes de UI"
      
      start:
        help: "Inicia o mock. Uso: mock_data start [all | 1-24]"
        type: "string"
      stop:
        help: "Para a geração de dados simulados"
        type: "null"

  clear: { help: "Limpa a tela do terminal" }
  help: { help: "Mostra esta lista de ajuda" }