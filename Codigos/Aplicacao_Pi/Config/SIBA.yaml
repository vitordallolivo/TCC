# ===================================================
#  This file contains setting of SIBA board 
# ===================================================

enums:
  func_type:
    - FUNC_START
    - FUNC_STOP
    - FUNC_RESET
    - FUNC_LOAD_CELL      # Load cell specific operations
    - FUNC_PITOT          # Pitot tube configuration
    - FUNC_CURRENT_SENSE  # Current sensor configuration
    - FUNC_ESC            # ESC control (0-100%)
    - FUNC_BATTERY        # Battery relay connection

  instruct_type:
    - INSTR_READ
    - INSTR_WRITE

  status_type:
    - STATUS_OK
    - STATUS_ERROR

  # Used within the 'value' field when func_type is FUNC_LOAD_CELL
  load_cell_action:
    - LC_ACTION_NONE
    - LC_ACTION_TARE
    - LC_ACTION_CALIBRATE
    - LC_ACTION_RESET_DEFAULT

  log_status:
    - LOG_VALID
    - LOG_INVALID
    - LOG_OVERFLOW
    - LOG_CRITICAL_ALARM

structs:
  CMD:
    - name: function
      type: func_type      # Main command category
    - name: instruction
      type: instruct_type   # Read or Write
    - name: target_id
      type: int            # Index (e.g., Load Cell ID 0-5)
    - name: value
      type: float          # Data (e.g., Gain, Offset, or Duty Cycle)
    - name: status
      type: status_type    # Command execution result

  TELEMETRY_LOG:
    - name: timestamp
      type: uint32         # System uptime in milliseconds
    - name: load_cell_0
      type: float          # Force in N or kg
    - name: load_cell_1
      type: float
    - name: load_cell_2
      type: float
    - name: load_cell_3
      type: float
    - name: load_cell_4
      type: float
    - name: load_cell_5
      type: float
    - name: v_batt
      type: float          # Battery Voltage (V)
    - name: i_batt
      type: float          # Battery Current (A)
    - name: soc
      type: float          # State of Charge (0.0 - 100.0%)
    - name: temperature
      type: float          # Main system or motor temperature (°C)
    - name: air_speed
      type: float          # Pitot tube wind speed (m/s)
    - name: rpm
      type: float          # Motor revolutions per minute
    - name: status
      type: log_status     # Integrity of the telemetry frame

Battery:
  - StandardVoltage: 4.2
  - StandardMaxTemp: 80 # Degress

  - name: CHNL-6S-3300mAh-40C
    # Datasheet infos
    cell: 6
    capacity: 3300

    # SOC polynomial (4th Degree) from experimental data
    SOCp0: 0
    SOCp1: 0
    SOCp2: 0
    SOCp3: 0
    SOCp4: 0
