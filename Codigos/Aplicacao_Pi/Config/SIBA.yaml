# ===================================================
#  This file contains setting of SIBA board 
# ===================================================

# CMD -> FUNCTION, INSTRUCTION, TARGET, VALUE, STATUS OR ACTION

DEFAULT_IP_BOARD : "169.254.97.200"
DEFAULT_PORT: 5555 

enums:
  func_type:
    - FUNC_START
    - FUNC_STOP
    - FUNC_RESET
    - FUNC_SENSOR
    # Needs to be separate because of safety priority
    - FUNC_ESC            
    - FUNC_BATTERY        

  instruct_type:
    - INSTR_READ
    - INSTR_WRITE
    - INSTR_NONE
    - INSTR_DEFAULT # Logic link: default_action / battery_action

  # ATENÇÃO: a ordem/índice aqui precisa bater 1:1 com SENSOR_ID_* em
  # Log_Manager.h (gerado a partir de SENSORS abaixo) — CMD_Core.c usa
  # cmd->target_id diretamente como índice de sensor_cfg[]/adc_calib[]
  # (ver apply_sensor_calib em CMD_Core.c). Qualquer descompasso aqui faz
  # a calibração ser aplicada ao sensor errado silenciosamente.
  target_type:
    - TARGET_LOAD_CELL_0_enum     # 0  -> SENSOR_ID_LOAD_CELL_0
    - TARGET_LOAD_CELL_1_enum     # 1  -> SENSOR_ID_LOAD_CELL_1
    - TARGET_LOAD_CELL_2_enum     # 2  -> SENSOR_ID_LOAD_CELL_2
    - TARGET_LOAD_CELL_3_enum     # 3  -> SENSOR_ID_LOAD_CELL_3
    - TARGET_LOAD_CELL_4_enum     # 4  -> SENSOR_ID_LOAD_CELL_4
    - TARGET_LOAD_CELL_5_enum     # 5  -> SENSOR_ID_LOAD_CELL_5
    - TARGET_VOLTAGE_DIVIDOR      # 6  -> SENSOR_ID_V_BATT
    - TARGET_CURRENT_SENSOR       # 7  -> SENSOR_ID_I_BATT
    - TARGET_BATTERY_SOC          # 8  -> SENSOR_ID_SOC (sem hardware/calibração própria — placeholder de alinhamento)
    - TARGET_TEMPERATURE_SENSOR   # 9  -> SENSOR_ID_TEMPERATURE_BATTERY
    - TARGET_PITOT_TUBE           # 10 -> SENSOR_ID_AIR_SPEED
    - TARGET_DEFAULT              # 11 -> alvo genérico (START/STOP/RESET)

  status_type:
    - STATUS_OK
    - STATUS_ERROR
    - STATUS_NONE # Don't care

  default_action:
    - DEFAULT_ACTION_NONE # Does nothing
    # Sensor typical actions y = LINEAR_COEFF *x + OFFSET_COEF
    # Serves for sensor like current, voltage, ESC, pitot and Load Cells
    # For load cells Linear coeff = Calibrate, and Offset coeff = Tare
    - DEFAULT_ACTION_SENSE_LINEAR_COEF 
    - DEFAULT_ACTION_SENSE_OFFSET_COEF 
    - DEFAULT_ACTION_SENSE_RESET_DEFAULT

  battery_action:
    # Overwrites polynomial
    - BAT_ACTION_P0_OVERWRITE
    - BAT_ACTION_P1_OVERWRITE
    - BAT_ACTION_P2_OVERWRITE
    - BAT_ACTION_P3_OVERWRITE
    - BAT_ACTION_P4_OVERWRITE
    # Overwrites default Temperature limit
    - BAT_ACTION_TEMP_LIMIT_OVERWRITE  
    # Controls relay to turn on ESC
    - BAT_ACTION_RELAY

  log_status:
    - LOG_VALID
    - LOG_INVALID
    - LOG_OVERFLOW
    - LOG_CRITICAL_ALARM
    - LOG_DENIED_ACTION

structs:  

  SENSORS: # Configuration of sensors
    - { name: SensorTarget, type: target_type }
    - { name: Linear_Coeff, type: float }
    - { name: Offset_Coeff, type: float }
    - { name: Max_Valid_Value, type: float }
    - { name: Minimum_Valid_Value, type: float }
    - { name: Linear_Coeff_Reset_Default, type: float}
    - { name: Offset_Coeff_Reset_Default, type: float}

  CMD:
    - { name: function, type: func_type }      # Main command category
    - { name: instruction, type: instruct_type }   # Read or Write
    - { name: target_id, type: int8_t }           
    - { name: value, type: float }               # Data (e.g., Gain, Offset, or Duty Cycle)
    - { name: action_or_status, type: int8_t }  # Overloaded: battery_action, default_action or status_type

  TELEMETRY_LOG:
    - { name: timestamp, type: uint32_t }          # System uptime in milliseconds
    - { name: load_cell_0, type: float }           # Force (in N or kgf) or Torque
    - { name: load_cell_1, type: float }
    - { name: load_cell_2, type: float }
    - { name: load_cell_3, type: float }
    - { name: load_cell_4, type: float }
    - { name: load_cell_5, type: float }
    - { name: v_batt, type: float }                # Battery Voltage (V)
    - { name: i_batt, type: float }                # Battery Current (A)
    - { name: soc, type: float }                   # State of Charge (0.0 - 100.0%)
    - { name: temperature_battery, type: float }
    - { name: air_speed, type: float }             # Pitot tube wind speed (m/s)
    - { name: rpm, type: float }                   # Motor revolutions per minute
    - { name: status, type: log_status }         # Integrity of the telemetry frame