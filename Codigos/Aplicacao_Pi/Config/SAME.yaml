# ===============================================================
# This file contains SAME board settings (Inverter & Motor Control)
# ===============================================================

DEFAULT_IP_BOARD : "169.254.97.100"
DEFAULT_PORT: 4444

enums:
  func_type:
    - FUNC_START
    - FUNC_STOP
    - FUNC_RESET
    - FUNC_SENSOR

  instruct_type:
    - INSTR_READ
    - INSTR_WRITE
    - INSTR_NONE
    - INSTR_DEFAULT # Logic link: default_action

  target_type:
    # There's not a ic because -> ia+ib+ic = 0
    - TARGET_CURRENT_A
    - TARGET_CURRENT_B
    # These are terminal voltages
    - TARGET_VOLTAGE_A
    - TARGET_VOLTAGE_B
    - TARGET_VOLTAGE_C
    # MOTOR PARAMETERS
    - TARGET_POLES_PAIRS 
    - TARGET_RESISTANCE
    - TARGET_INDUCTANCE
    - TARGET_KV_RATING
    # SMO PARAMETERS
    - TARGET_KS1
    - TARGET_KS2
    - TARGET_BEMF_LPF_FREQUENCY
    - TARGET_TORQUE_LPF_FREQUENCY
    # Default target, for function like start, stop and reset
    - TARGET_DEFAULT

  default_action:
    - DEFAULT_ACTION_NONE # Does nothing
    # Sensor typical actions y = LINEAR_COEFF * x + OFFSET_COEF
    - DEFAULT_ACTION_SENSE_LINEAR_COEF 
    - DEFAULT_ACTION_SENSE_OFFSET_COEF 
    - DEFAULT_ACTION_SENSE_RESET_DEFAULT
    # Default options for gains and filter (for example of the SMO)
    - DEFAULT_ACTION_SET_VALUE
    - DEFAULT_ACTION_VALUE_RESET_DEFAULT

  log_status:
    - LOG_VALID
    - LOG_INVALID
    - LOG_OVERFLOW
    - LOG_CRITICAL_ALARM
    - LOG_DENIED_ACTION

  status_type:
    - STATUS_OK
    - STATUS_ERROR
    - STATUS_NONE # Don't care

structs:
  CMD:
    - { name: function, type: func_type }      # Main command category
    - { name: instruction, type: instruct_type }   # Read or Write
    - { name: target_id, type: target_type }           
    - { name: value, type: float }               # Data (e.g., Gain, Offset)
    - { name: action_or_status, type: int8_t }  # Overloaded field for default_action or status

  TELEMETRY_LOG:
    # Real measures from ADC/Shunts
    - { name: V_a, type: float }
    - { name: V_b, type: float }
    - { name: V_c, type: float }
    - { name: i_a, type: float }
    - { name: i_b, type: float }
    - { name: i_c, type: float }
    # Clark-Park Transformation / Observer variables (SMO)
    - { name: V_alpha, type: float }
    - { name: V_beta, type: float }
    - { name: i_alpha, type: float }
    - { name: i_beta, type: float }
    - { name: rpm, type: float }
    - { name: torque, type: float }
    - { name: status, type: log_status }

# Metadata for GUI and Simulation
motors:
  A-5025-310KV:
    physical_params:
      pole_pairs: 14
      resistance_ohm: 0.045
      inductance_henry: 0.00012
      kv_rating: 310 
    smo_config:
      ks1: 2000.0
      ks2: 3500.0
      bemf_lpf_hz: 40.0
      torque_filter_hz: 2.0

  4020-630KV:
    physical_params:
      pole_pairs: 7
      resistance_ohm: 0.082
      inductance_henry: 0.000095
      kv_rating: 630 
    smo_config:
      ks1: 1200.0
      ks2: 2200.0
      bemf_lpf_hz: 60.0
      torque_filter_hz: 5.0

system_defaults:
  sampling_rate_hz: 10000    
  pwm_frequency_hz: 20000    
  deadtime_cycles: 48