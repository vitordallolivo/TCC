# ===============================================================
# This file contains SAME board settings (Inverter & Motor Control)
# ===============================================================

DEFAULT_IP_BOARD : "169.254.97.100"
DEFAULT_PORT: 4444

# Bloco de link (fonte de verdade do endereçamento, lido por
# Communication_Data/registry.py). pc_rx = porta onde o PC ESCUTA a telemetria;
# board_rx = porta onde a placa ESCUTA os comandos CMD.
link:
  transport: udp_struct
  ip: "169.254.97.100"
  ports:
    pc_rx: 4445
    board_rx: 4444

enums:
  func_type:
    - FUNC_START
    - FUNC_STOP
    - FUNC_RESET
    - FUNC_SENSOR

  instruct_type:
    - INSTR_READ
    - INSTR_WRITE
    - INSTR_NONE
    - INSTR_DEFAULT # Logic link: default_action

  target_type:
    - TARGET_CURRENT_A
    - TARGET_CURRENT_B
    - TARGET_CURRENT_C
    # These are terminal voltages
    - TARGET_VOLTAGE_AB
    - TARGET_VOLTAGE_BC
    # MOTOR PARAMETERS
    - TARGET_POLES_PAIRS 
    - TARGET_RESISTANCE
    - TARGET_INDUCTANCE
    - TARGET_KV_RATING
    # SMO PARAMETERS
    - TARGET_KS1
    - TARGET_KS2
    - TARGET_BEMF_LPF_FREQUENCY
    - TARGET_TORQUE_LPF_FREQUENCY
    # Default target, for function like start, stop and reset
    - TARGET_DEFAULT

  default_action:
    - DEFAULT_ACTION_NONE # Does nothing
    # Sensor typical actions y = LINEAR_COEFF * x + OFFSET_COEF
    - DEFAULT_ACTION_SENSE_LINEAR_COEF 
    - DEFAULT_ACTION_SENSE_OFFSET_COEF 
    - DEFAULT_ACTION_SENSE_RESET_DEFAULT
    # Default options for gains and filter (for example of the SMO)
    - DEFAULT_ACTION_SET_VALUE
    - DEFAULT_ACTION_VALUE_RESET_DEFAULT

  log_status:
    - LOG_VALID
    - LOG_INVALID
    - LOG_OVERFLOW
    - LOG_CRITICAL_ALARM
    - LOG_DENIED_ACTION

  status_type:
    - STATUS_OK
    - STATUS_ERROR
    - STATUS_NONE # Don't care

structs:

  SENSORS:
    - { name: SensorTarget, type: target_type }
    - { name: Linear_Coeff, type: float }
    - { name: Offset_Coeff, type: float }
    - { name: Max_Valid_Value, type: float }
    - { name: Minimum_Valid_Value, type: float }
    - { name: Linear_Coeff_Reset_Default, type: float}
    - { name: Offset_Coeff_Reset_Default, type: float}

  CMD:
    - { name: function, type: func_type }      # Main command category
    - { name: instruction, type: instruct_type }   # Read or Write
    - { name: target_id, type: target_type }           
    - { name: value, type: float }               # Data (e.g., Gain, Offset)
    - { name: action_or_status, type: int8_t }  # Overloaded field for default_action or status

  TELEMETRY_LOG:
    - { name: timestamp, type: uint32_t }
    # Real measures from ADC/Shunts
    - { name: V_a, type: float }
    - { name: V_b, type: float }
    - { name: V_c, type: float }
    - { name: i_a, type: float }
    - { name: i_b, type: float }
    - { name: i_c, type: float }
    # Clark-Park Transformation / Observer variables (SMO)
    - { name: V_alpha, type: float }
    - { name: V_beta, type: float }
    - { name: i_alpha, type: float }
    - { name: i_beta, type: float }
    - { name: rpm_same, type: float }
    - { name: torque_eletrico, type: float }
    - { name: torque_helice, type: float }
    - { name: status, type: log_status }
