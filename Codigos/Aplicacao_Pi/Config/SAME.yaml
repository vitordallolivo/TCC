# ===============================================================
# This file contains SAME board settings (Inverter & Motor Control)
# ===============================================================

DEFAULT_IP_BOARD : "169.254.97.100"
DEFAULT_PORT: 4444

# Bloco de link (fonte de verdade do endereçamento, lido por
# Communication_Data/registry.py). pc_rx = porta onde o PC ESCUTA a telemetria;
# board_rx = porta onde a placa ESCUTA os comandos CMD.
link:
  transport: udp_struct
  ip: "169.254.97.100"
  ports:
    pc_rx: 4445
    board_rx: 4444

enums:
  func_type:
    - FUNC_START
    - FUNC_STOP
    - FUNC_RESET
    - FUNC_SENSOR

  instruct_type:
    - INSTR_READ
    - INSTR_WRITE
    - INSTR_NONE
    - INSTR_DEFAULT # Logic link: default_action

  target_type:
    - TARGET_CURRENT_A
    - TARGET_CURRENT_B
    - TARGET_CURRENT_C
    # 3 tensões de FASE (ADC1 lê V_a/V_b/V_c independentemente — cada uma com
    # seu próprio divisor resistivo, calibração própria, igual às 3 correntes).
    - TARGET_VOLTAGE_A
    - TARGET_VOLTAGE_B
    - TARGET_VOLTAGE_C
    # MOTOR PARAMETERS
    - TARGET_POLES_PAIRS 
    - TARGET_RESISTANCE
    - TARGET_INDUCTANCE
    - TARGET_KV_RATING
    # SMO PARAMETERS — ganhos na forma Gamma (Γ = K·Ts, invariante ao passo).
    # O firmware recupera K = Γ/Ts com o seu próprio Ts. NÃO usar Ks* (dependem
    # de Ts). Ver ../../SAME/CLAUDE.md.
    - TARGET_GAMMA1
    - TARGET_GAMMA2
    - TARGET_GAMMAT
    - TARGET_BEMF_LPF_FREQUENCY
    - TARGET_TORQUE_LPF_FREQUENCY
    # Tempos de amostragem: ADC (rápido, µs) e telemetria UDP (ms) desacoplados
    # para o UDP não travar a operação do ADC.
    - TARGET_TS_ADC
    - TARGET_TS_UDP
    # Default target, for function like start, stop and reset
    - TARGET_DEFAULT

  default_action:
    - DEFAULT_ACTION_NONE # Does nothing
    # Sensor typical actions y = LINEAR_COEFF * x + OFFSET_COEF
    - DEFAULT_ACTION_SENSE_LINEAR_COEF
    - DEFAULT_ACTION_SENSE_OFFSET_COEF
    - DEFAULT_ACTION_SENSE_RESET_DEFAULT
    - DEFAULT_ACTION_SENSE_MAX_VALID
    - DEFAULT_ACTION_SENSE_MIN_VALID
    # Default options for gains and filter (for example of the SMO)
    - DEFAULT_ACTION_SET_VALUE
    - DEFAULT_ACTION_VALUE_RESET_DEFAULT

  log_status:
    - LOG_VALID
    - LOG_INVALID
    - LOG_OVERFLOW
    - LOG_CRITICAL_ALARM
    - LOG_DENIED_ACTION

  status_type:
    - STATUS_OK
    - STATUS_ERROR
    - STATUS_NONE # Don't care

# Códigos de erro agregados — 1 bit por condição. FONTE ÚNICA: gera o enum C
# `same_error_bit_t` (lib/SYS/Error_Codes.h, via generate.py) E alimenta a
# decodificação em pt-BR da GUI (Communication_Data/errors.py). O Security_Manager
# da SAME agrega os bits e envia o uint32_t em TELEMETRY_LOG.error_code. Como a
# SAME só OBSERVA (não aciona o motor), estes são diagnósticos — não há parada de
# emergência. `bit` = posição (0..31); `msg` = mensagem clara; `group` = área.
error_bits:
  # --- Medição (sanidade dos sensores de fase deste tipo de motor) ---
  - { name: ERROR_MEAS_CURRENT_IMBALANCE, bit: 0, group: "Medição", msg: "As correntes das 3 fases não somam zero — sensor de corrente com falha, fase aberta ou calibração fora" }
  - { name: ERROR_MEAS_VOLTAGE_IMBALANCE, bit: 1, group: "Medição", msg: "As tensões das 3 fases não somam zero — divisor/fase com problema ou calibração fora" }
  - { name: ERROR_MEAS_OVERCURRENT,       bit: 2, group: "Medição", msg: "Corrente de fase acima do limite seguro" }
  - { name: ERROR_MEAS_SENSOR_RANGE,      bit: 3, group: "Medição", msg: "Leitura de tensão/corrente fora da faixa válida do sensor (saturado ou desconectado)" }
  # --- Observador (saúde do SMO+PLL sensorless) ---
  - { name: ERROR_OBS_BEMF_TOO_LOW,   bit: 8,  group: "Observador", msg: "Força contraeletromotriz baixa demais para o observador travar — motor parado/muito lento; rotação e torque estimados não são confiáveis" }
  - { name: ERROR_OBS_PLL_UNLOCKED,   bit: 9,  group: "Observador", msg: "PLL sem sincronismo (erro de fase alto) — ângulo/rotação estimados não confiáveis" }
  - { name: ERROR_OBS_DIVERGED,       bit: 10, group: "Observador", msg: "Observador divergiu (valores não finitos) — reduza os ganhos Γ ou o passo Ts" }
  - { name: ERROR_OBS_RPM_IMPLAUSIBLE, bit: 11, group: "Observador", msg: "Rotação estimada acima do limite plausível para este motor" }
  # --- Configuração (parâmetros do observador) ---
  - { name: ERROR_CFG_MOTOR_PARAM_INVALID, bit: 16, group: "Configuração", msg: "Parâmetro do motor inválido (R, L, pares de polos, Kv ou Ts ≤ 0) — configure antes de estimar" }
  - { name: ERROR_CFG_GAMMA_SIGN,          bit: 17, group: "Configuração", msg: "Sinais dos ganhos Γ incorretos (regra fixa: Γ1 > 0, Γ2 < 0, Γt > 0)" }
  # --- Sistema ---
  - { name: ERROR_SYS_ADC_READ_FAILED, bit: 24, group: "Sistema", msg: "Falha na leitura do ADC (aquisição elétrica interrompida)" }
  - { name: ERROR_SYS_ADC_FRAME_DROP,  bit: 25, group: "Sistema", msg: "Frames do ADC descartados — a ISR não acompanhou a taxa de conversão; as amostras do observador estão deslocadas no tempo" }
  # --- Calibração de offset (sensor Hall de corrente) ---
  # O SS49E parte em Vcc/2 e deriva no aquecimento inicial do ASIC: nos ensaios
  # de bancada o repouso a 0 A variou 5,8 mV entre corridas, o que na cadeia de
  # 16,875 mV/A vale 0,31 A de corrente fantasma — comum às 3 fases, portanto
  # sequência zero na Clarke e BEMF espúria no SMO. Daí a medição no boot.
  - { name: ERROR_CAL_IN_PROGRESS, bit: 26, group: "Calibração", msg: "Calibração de offset em andamento (aguardando o sensor Hall estabilizar, com o ESC parado) — rotação e torque ainda não são válidos" }
  - { name: ERROR_CAL_FAILED,      bit: 27, group: "Calibração", msg: "Calibração de offset falhou: ruído alto demais nas correntes com o ESC parado — ESC energizado durante a calibração, sensor mal alimentado ou terra aberto" }
  - { name: ERROR_SYS_NET_DISCONNECTED, bit: 28, group: "Sistema", msg: "Rede desconectada — PHY sem link ou interface Ethernet não inicializada; telemetria não está chegando ao PC" }

# Limiares dos checadores do Security_Manager (SAME). FONTE ÚNICA: gera os
# #defines em lib/SYS/Security_prm.h (via generate.py). Ajuste em bancada aqui —
# não edite o header gerado. `value` vira literal float C (sufixo f).
security_limits:
  - { name: SM_IMBAL_FRAC,     value: 0.15,    comment: "fração tolerável do desequilíbrio (15% da soma dos módulos das 3 fases)" }
  - { name: SM_IMBAL_ABS_I,    value: 0.5,     comment: "desequilíbrio absoluto de corrente tolerável [A] (cobre o skew do sampling sequencial)" }
  - { name: SM_IMBAL_ABS_V,    value: 1.0,     comment: "desequilíbrio absoluto de tensão tolerável [V]" }
  - { name: SM_OVERCURRENT_A,  value: 60.0,    comment: "limite de sobrecorrente de fase [A]" }
  - { name: SM_SENSOR_ABS_MAX, value: 500.0,   comment: "leitura de V/A acima disso = sensor saturado ou desconectado" }
  - { name: SM_BEMF_MIN,       value: 1.0,     comment: "|ê| mínimo p/ PLL travar (deve casar com o limiar em Observer_Step)" }
  - { name: SM_PLL_ERR_MAX,    value: 0.35,    comment: "erro de fase da PLL tolerável [rad]" }
  - { name: SM_RPM_MAX,        value: 60000.0, comment: "rpm mecânico plausível máximo" }
  # --- Calibração de offset do Hall no boot ---
  - { name: SM_CAL_SETTLE_MS,  value: 2000.0,  comment: "espera antes de amostrar o offset [ms]: o SS49E parte em Vcc/2 e deriva no aquecimento inicial do ASIC; medir cedo trava um offset errado" }
  - { name: SM_CAL_FRAMES,     value: 4096.0,  comment: "frames acumulados para a média do offset (com o ESC parado)" }
  - { name: SM_CAL_STD_MAX_MV, value: 8.0,     comment: "desvio-padrão máximo tolerado nas amostras de offset [mV no pino]; acima disso a calibração FALHA em vez de gravar lixo (8 mV ~ 0,47 A na cadeia)" }

# Defaults de calibração afim (y = linear*x + offset) + faixa válida por
# sensor calibrável — fonte única, alimenta CMD_Core_prm.h (gerado, ver
# generate.py). `target` tem que ser um nome de enums.target_type existente.
# A entrada `x` da reta é a tensão NO PINO do ADC, em mV (HAL::raw_to_mv).
#
# CORRENTE — SS49E (N=1, condutor passando uma vez pelo furo do toróide) com
# divisor R1=2k0 / R2=18k na saída: o repouso do sensor é ratiométrico em
# Vcc/2 = 2,5 V e ±60 A levariam a saída a 3,625 V, acima dos 3,3 V que o
# conversor aceita.
#   sensibilidade do sensor : 18,750 mV/A   (regressão do ensaio, N=1)
#   atenuação do divisor    : k = 18/(18+2) = 0,900
#   ganho da cadeia         : 18,750 x 0,900 = 16,875 mV/A  (47,7 mA/LSB)
#   linear                  : 1/16,875 = 0,0592593 A/mV
#   offset nominal          : -(2,4866 x 0,900) V x linear = -132,64 A
#
# ⚠️ O OFFSET AQUI É SÓ CHUTE DE PARTIDA — tem de ser levantado a cada boot.
# Nos três ensaios do Apêndice A o repouso a 0 A caiu em 2,48570 / 2,48640 /
# 2,49150 V: 5,8 mV de espalhamento, que nesta cadeia valem 0,31 A de corrente
# FANTASMA. E ela é comum às três fases, então atravessa a Clarke como
# componente de sequência zero e vira BEMF espúria no SMO. Por isso o firmware
# mede o repouso real no boot, com o ESC parado, e sobrescreve estes valores.
# Ver SAME/CLAUDE.md, "Calibração de offset dos sensores".
#
# TENSÃO — divisor R1=130k / R2=7k5; fundo de escala 60,5 V (dobro do
# barramento, folga para o sobressinal de comutação).
#   atenuação : k = 7,5/137,5 = 0,0545455
#   linear    : 1/k/1000 = 0,0183333 V/mV   (14,8 mV/LSB)
#
# min/max: faixa física da cadeia. Fora dela = sensor saturado, desconectado
# ou terra aberto.
sensor_defaults:
  - { target: TARGET_CURRENT_A, linear: 0.0592593, offset: -132.64, min: -70.0, max: 70.0 }
  - { target: TARGET_CURRENT_B, linear: 0.0592593, offset: -132.64, min: -70.0, max: 70.0 }
  - { target: TARGET_CURRENT_C, linear: 0.0592593, offset: -132.64, min: -70.0, max: 70.0 }
  - { target: TARGET_VOLTAGE_A, linear: 0.0183333, offset: 0.0, min: -1.0, max: 65.0 }
  - { target: TARGET_VOLTAGE_B, linear: 0.0183333, offset: 0.0, min: -1.0, max: 65.0 }
  - { target: TARGET_VOLTAGE_C, linear: 0.0183333, offset: 0.0, min: -1.0, max: 65.0 }

structs:

  SENSORS:
    - { name: SensorTarget, type: target_type }
    - { name: Linear_Coeff, type: float }
    - { name: Offset_Coeff, type: float }
    - { name: Max_Valid_Value, type: float }
    - { name: Minimum_Valid_Value, type: float }
    - { name: Linear_Coeff_Reset_Default, type: float}
    - { name: Offset_Coeff_Reset_Default, type: float}

  CMD:
    - { name: function, type: func_type }      # Main command category
    - { name: instruction, type: instruct_type }   # Read or Write
    - { name: target_id, type: target_type }           
    - { name: value, type: float }               # Data (e.g., Gain, Offset)
    - { name: action_or_status, type: int8_t }  # Overloaded field for default_action or status

  TELEMETRY_LOG:
    - { name: timestamp, type: uint32_t }
    # Real measures from ADC/Shunts
    - { name: V_a, type: float }
    - { name: V_b, type: float }
    - { name: V_c, type: float }
    - { name: i_a, type: float }
    - { name: i_b, type: float }
    - { name: i_c, type: float }
    # Clark-Park Transformation / Observer variables (SMO)
    - { name: V_alpha, type: float }
    - { name: V_beta, type: float }
    - { name: i_alpha, type: float }
    - { name: i_beta, type: float }
    - { name: rpm_same, type: float }
    - { name: torque_eletrico, type: float }
    - { name: torque_helice, type: float }
    - { name: status, type: log_status }         # Integridade do frame de telemetria
    - { name: error_code, type: uint32_t }        # Bitfield agregado pelo Security_Manager (1 bit/condição) — ver same_error_bit_t
