# Motor da bancada (Scorpion A-5025-310Kv).
# Kv: valor de placa (o √3 do barramento para o pico de fase fica no cálculo
#     do Ke, no firmware e na GUI).
# R: de fase, ensaio de rotor bloqueado do TCC (R_LL/2).
# L: de fase, ajustada nos registros de osciloscópio da bancada.
# Ganhos Γ: autotune do observador com Ts = 10 µs.
name: Scorpion_A-5025-310Kv
physical_params:
  poles: 14
  pole_pairs: 7
  connection: Y
  kv_rating: 310.0
  resistance_ohm: 0.00869
  inductance_henry: 1.13e-05
  v_bus: 30.0
smo_config:
  gamma1: 31.62
  gamma2: -10.0
  gammat: 0.154
  bl: 18.0
  switch_func: tanh
  pll_wn_hz: 150.0
  bemf_lpf_hz: 0.0
  torque_filter_hz: 10000.0
sampling:
  ts_adc_us: 10.0
  ts_udp_ms: 100.0
