CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_REBOOT=y

# ADC — SAME usa DOIS ADCs convencionais (ADC1 = tensões de fase, ADC2 =
# correntes de fase), cada um com seu canal DMA1 (ver same_board.dts). O
# driver custom adc_ch32v307 (drivers/adc) atende ambas as instâncias.
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_ADC_LOG_LEVEL_DBG=n
# Driver upstream adc_ch32v00x.c também usa DT_DRV_COMPAT "wch,adc" e vence a
# ligação com os nós `adc1`/`adc2`, descartando nosso libadc_ch32v307.a — sem
# .read_async, o adc_read_async() vira jalr por ponteiro NULL. Ver mesma nota
# na SIBA (prj.conf). Desabilitado aqui.
CONFIG_ADC_CH32V00X=n

# Rede (mesmo transporte UDP da SIBA — protocolo em SAME.yaml)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_CONFIG_MY_IPV4_ADDR="169.254.97.100"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="169.254.97.139"
CONFIG_NET_SOCKETS=y

# Build
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_BUILD_OUTPUT_BIN=y

# LOGs e USART
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# O SMO usa ponto flutuante em quase todo cálculo (Clarke, PLL, LPF) e os
# logs imprimem %f — sem FPU o hardware faz em soft-float (ok) mas o
# cbprintf precisa do suporte a float.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_HEAP_MEM_POOL_SIZE=8192

# I2C2 — EEPROM FT24C32A (PB10=SCL, PB11=SDA)
CONFIG_I2C=y

# Log buffer padrão (1024 B) causa "N messages dropped" no boot com FPU_SHARING
CONFIG_LOG_BUFFER_SIZE=4096

# Observer_Step roda na ISR de DMA com FPU_SHARING — stack padrão (2048) é
# insuficiente para salvar 32 regs FPU + call chain + locals de float.
CONFIG_ISR_STACK_SIZE=4096

# Sysworkq processa ETH carrier_on (~1-2 ms) enquanto o ADC ISR dispara a
# ~9,4 kHz. Com FPU_SHARING cada ISR salva 32 regs FP (128 B) na stack da
# thread interrompida. ~10 ISRs × 128 B + call chain do net_if_carrier_on
# (~500 B) > 4096 B → overflow → ethernet_context->iface corrompido.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# A logging_thread formata %f (cbprintf) com FPU_SHARING ativo — stack padrão
# (1024) é insuficiente para salvar contexto FPU + cbprintf float.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y
CONFIG_MAIN_STACK_SIZE=4096

# Idle thread: default=256B, mas com FPU_SHARING o _isr_wrapper salva 80B de
# ESF na stack da thread interrompida. Se o idle estiver com sp próximo do
# topo de RAM (comportamento do Zephyr: idle começa em _end_of_ram), o save
# extrapola e fp_trap_exit falha com Load access fault em 0x20020018.
CONFIG_IDLE_STACK_SIZE=512

# Debug de bancada: imprime status de rede + telemetria na UART a cada 5 s
CONFIG_SAME_NET_STATUS_UART=y
