# Overlay de configuração para `west build -b native_sim` — mesmo esquema da
# SIBA (ver SIBA/boards/native_sim.conf). Roda o firmware da SAME como binário
# POSIX no host: sem CH32V307, sem os 2 ADCs custom, sem MAC Ethernet.
#
# REDE: Offloaded sockets (NSOS) — zsock_* de NCI.c vão direto aos sockets BSD
# do host (127.0.0.1), então a Aplicacao_Pi troca UDP de verdade com o
# firmware sem TAP/root.
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_DRIVERS=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_IPV6_DAD=n
# IP de loopback DISTINTO por placa (espelha a topologia real: SIBA .200,
# SAME .100 — cada nó é um host diferente). Mapeia o último octeto do IP
# link-local real (169.254.97.100) para 127.0.0.100, para SAME e SIBA não
# compartilharem o mesmo 127.0.0.1 ao rodar juntos em native_sim. PEER = para
# onde a placa envia a telemetria (o "PC" no loopback); a Aplicacao_Pi usa o
# mesmo mapeamento (ver Communication_Data/manager.py::_native_loopback).
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="127.0.0.100"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="127.0.0.100"
CONFIG_NET_CONFIG_NEED_IPV4=y

# Os dois ADCs custom não compilam para native_sim — em vez de mockar o HAL,
# ligamos o emulador ADC in-tree sob os MESMOS nodelabels `adc1`/`adc2` (ver
# boards/native_sim.overlay). HAL.c usa só a API genérica
# adc_channel_setup/adc_read_async → roda sem alteração.
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_ADC_EMUL=y
CONFIG_ADC_LOG_LEVEL_DBG=n

# native_sim não tem pinctrl_soc.h (pinctrl é específico do CH32V307) — o ADC
# emulado não usa pinos, então PINCTRL fica desligado.
CONFIG_PINCTRL=n

# GPIO precisa ficar LIGADO: a SAME tem sim periférico de GPIO (LEDs de status
# PB4/PA15), e Security_Manager.c/NCI.c os acessam com GPIO_DT_SPEC_GET sem
# guarda #ifdef CONFIG_ARCH_POSIX. Com GPIO=n o link quebrava com
# "undefined reference to __device_dts_ord_*". Aqui o driver é o gpio_emul
# in-tree, sobre os nós declarados em boards/native_sim.overlay.
CONFIG_GPIO=y

# I2C2 (PB10/PB11) — o driver wch,i2c não compila para native_sim, mas o
# nodelabel `i2c2` existe via zephyr,i2c-emul-controller (ver
# boards/native_sim.overlay), mesma estratégia do ADC. CONFIG_EMUL é o
# framework genérico exigido por CONFIG_I2C_EMUL. Sem dispositivo no
# barramento emulado o NVM_Init falha e o firmware segue com os defaults.
CONFIG_I2C=y
CONFIG_EMUL=y
CONFIG_I2C_EMUL=y

# Sem FPU ligada, todo "%f" de LOG_*/observador sai como texto literal em
# native_sim (host tem FPU, mas o cbprintf não). O SMO é todo float.
CONFIG_FPU=y

# Em native_sim o board já seleciona LOG_BACKEND_NATIVE_POSIX (stdout do host);
# deixar o backend de UART ligado duplicaria cada linha. Desliga aqui.
CONFIG_LOG_BACKEND_UART=n
